name: Taxscouts
description: >-
  TaxScouts is a UK online tax-return and Self Assessment service that pairs
  individuals, sole traders, landlords and investors with accredited accountants
  to prepare, review and file their taxes with HMRC for a flat fee. Founded in
  London, TaxScouts was acquired by Taxfix and its taxscouts.com domain now
  redirects to taxfix.com/en-uk. The service is a consumer-facing web and mobile
  product with pricing tiers for one-off filing, optimisation with HMRC audit
  protection, and year-round accountant support. As of this profile it exposes
  no public developer API, developer portal, or machine-readable API
  documentation; this record captures its public identity and web properties
  for the API Evangelist network.
